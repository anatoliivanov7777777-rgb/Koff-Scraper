name: Sync to case-king.bg

# Ръчно пускане + автоматично всяка нощ.
#
# При schedule няма github.event.inputs, затова има резервни стойности.
on:
  workflow_dispatch:
    inputs:
      live:
        description: 'LIVE (true = реален запис в case-king.bg, false = само преглед)'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

      limit:
        description: 'Лимит продукти (напр. 5). За пълен run напиши: all'
        required: false
        default: '5'

      cleanup:
        description: 'CLEANUP (true = изтрива source=koff-sync без да качва нови)'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

      force:
        description: 'FORCE (true = пропуска проверката за минимален брой продукти)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

  schedule:
    - cron: '0 3 * * *'

concurrency:
  group: sync-caseking
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    defaults:
      run:
        working-directory: koff-scraper/scraper

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Run koff.ro scraper
        if: github.event.inputs.cleanup != 'true'
        env:
          KOFF_EMAIL: ${{ secrets.KOFF_EMAIL }}
          KOFF_PASSWORD: ${{ secrets.KOFF_PASSWORD }}
          CONVEX_HTTP_URL: ${{ secrets.CONVEX_HTTP_URL }}
          SCRAPER_SECRET: ${{ secrets.SCRAPER_SECRET }}
        run: npm run scrape

      - name: Sync to CaseKing Convex
        env:
          CASEKING_CONVEX_URL: ${{ secrets.CASEKING_CONVEX_URL }}
          LIVE: ${{ github.event.inputs.live || 'true' }}
          LIMIT: ${{ github.event.inputs.limit || 'all' }}
          CLEANUP: ${{ github.event.inputs.cleanup || 'false' }}
          FORCE: ${{ github.event.inputs.force || 'false' }}
        run: node sync-caseking.mjs
