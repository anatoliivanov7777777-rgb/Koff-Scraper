name: Sync to case-king.bg

on:
  workflow_dispatch:
    inputs:
      live:
        description: 'LIVE (true = реален запис в case-king.bg, false = само преглед)'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

      limit:
        description: 'Лимит продукти (напр. 5). За пълен run напиши: all'
        required: false
        default: '5'

      cleanup:
        description: 'CLEANUP'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

      force:
        description: 'FORCE'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

  schedule:
    - cron: '0 3 * * *'

concurrency:
  group: sync-caseking
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install scraper dependencies
        working-directory: koff-scraper/scraper
        run: npm install

      - name: Configure Convex backend path
        working-directory: koff-scraper/scraper
        run: |
          cat > convex.json <<'EOF'
          {
            "functions": "../convex"
          }
          EOF

      - name: Deploy scraper Convex backend
        working-directory: koff-scraper/scraper
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: npx convex deploy

      - name: Run koff.ro scraper
        if: github.event.inputs.cleanup != 'true'
        working-directory: koff-scraper/scraper
        env:
          KOFF_EMAIL: ${{ secrets.KOFF_EMAIL }}
          KOFF_PASSWORD: ${{ secrets.KOFF_PASSWORD }}
          CONVEX_HTTP_URL: ${{ secrets.CONVEX_HTTP_URL }}
          SCRAPER_SECRET: ${{ secrets.SCRAPER_SECRET }}
        run: npm run scrape

      - name: Sync to CaseKing Convex
        working-directory: koff-scraper/scraper
        env:
          CASEKING_CONVEX_URL: ${{ secrets.CASEKING_CONVEX_URL }}
          LIVE: ${{ github.event.inputs.live || 'true' }}
          LIMIT: ${{ github.event.inputs.limit || 'all' }}
          CLEANUP: ${{ github.event.inputs.cleanup || 'false' }}
          FORCE: ${{ github.event.inputs.force || 'false' }}
        run: node sync-caseking.mjs
