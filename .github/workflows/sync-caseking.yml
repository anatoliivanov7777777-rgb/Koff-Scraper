name: Sync to case-king.bg

on:
  workflow_dispatch:
    inputs:
      live:
        description: 'LIVE (true = реален запис в case-king.bg, false = само преглед)'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

      limit:
        description: 'Лимит продукти'
        required: false
        default: '5'

      force:
        description: 'FORCE'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

      stock_zero:
        description: 'Продукти извън feed-а: dry = само брои, apply = нулира наличността'
        required: false
        default: 'dry'
        type: choice
        options:
          - 'dry'
          - 'apply'

  schedule:
    # Daily at 01:00 UTC (owner's instruction, 2026-10-01; was weekly, Sunday
    # 03:00 UTC). One full run - scrape, sync and the stock-zero pass - takes
    # about 8-11 minutes.
    - cron: '0 1 * * *'

concurrency:
  group: sync-caseking
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The dev sync has its OWN secret now (CASEKING_SYNC_DEV_SECRET), separate
      # from the shared CASEKING_SYNC_SECRET that the fulfillment workflows
      # still carry for the old production deployment. Check it before the long
      # scrape: an empty secret can only end in a failed sync, and this fails in
      # seconds with the reason instead of after ~10 minutes of scraping.
      - name: Check the dev sync secret is configured
        env:
          CASEKING_SYNC_SECRET: ${{ secrets.CASEKING_SYNC_DEV_SECRET }}
        run: |
          if [ -z "$CASEKING_SYNC_SECRET" ]; then
            echo "::error::CASEKING_SYNC_DEV_SECRET is empty or missing. Create this repository secret with the dev deployment's CASEKING_SYNC_SECRET value before running the sync — the shared CASEKING_SYNC_SECRET is no longer read here (it stays with the fulfillment workflows for the old production deployment)."
            exit 1
          fi

      - name: Install scraper dependencies
        working-directory: koff-scraper/scraper
        run: npm install

      - name: Run koff.ro scraper
        working-directory: koff-scraper/scraper
        env:
          KOFF_EMAIL: ${{ secrets.KOFF_EMAIL }}
          KOFF_PASSWORD: ${{ secrets.KOFF_PASSWORD }}
          # Incremental gallery pass. Durable state lives in the dedicated Koff
          # Convex project and is reused every run, so only the candidates the
          # planner selects receive a product-detail GET - an unchanged
          # catalogue costs none. More than 500 candidates, or more than 2% of
          # the catalogue, aborts detail fetching and requests nothing. A full
          # refresh stays disabled: FULL_GALLERY_REFRESH is deliberately not set.
          ENABLE_GALLERY_FETCH: "true"
          KOFF_GALLERY_STATE_HTTP_URL: ${{ secrets.KOFF_GALLERY_STATE_HTTP_URL }}
          KOFF_GALLERY_STATE_SECRET: ${{ secrets.KOFF_GALLERY_STATE_SECRET }}
        run: npm run scrape

      - name: Sync to CaseKing Convex
        working-directory: koff-scraper/scraper
        env:
          # Its OWN URL and secret, deliberately not the shared
          # CASEKING_CONVEX_URL / CASEKING_SYNC_SECRET: those are the
          # fulfillment workers' input, and they hard-pin the old production
          # deployment (elated-butterfly-122) because the live shop's orders
          # are still fulfilled from there. The dev sync targets
          # aware-toucan-771 (pinned in sync-caseking.mjs) and authenticates
          # with CASEKING_SYNC_DEV_SECRET. The env var NAME stays as the script
          # expects it; only the source differs.
          CASEKING_CONVEX_URL: ${{ secrets.CASEKING_SYNC_CONVEX_URL }}
          CASEKING_SYNC_SECRET: ${{ secrets.CASEKING_SYNC_DEV_SECRET }}
          LIVE: ${{ github.event.inputs.live || 'true' }}
          LIMIT: ${{ github.event.inputs.limit || 'all' }}
          CLEANUP: 'false'
          FORCE: ${{ github.event.inputs.force || 'false' }}
          # Scheduled runs carry no inputs: they take the whole feed ('all'
          # above) and APPLY the stock-zero pass - that is the daily job. A
          # manual dispatch keeps 'dry' as its default, so nothing applies
          # without someone choosing it.
          STOCK_ZERO_MODE: ${{ github.event_name == 'schedule' && 'apply' || github.event.inputs.stock_zero || 'dry' }}
        run: node sync-caseking.mjs

      # ---- LStar (lstarbg.com), the fourth supplier (owner, 2026-10-19) ----
      # Runs in the same job, right after the Koff sync, as the owner asked.
      #
      # Two locks keep it from writing before the owner's "да":
      #   1. the repository VARIABLE LSTAR_SYNC_ENABLED must be exactly "true"
      #      (Settings -> Secrets and variables -> Actions -> Variables); until
      #      then every LStar run is a DRY RUN, scheduled or not;
      #   2. the shop backend must have the lstarSync module deployed.
      # continue-on-error: a problem on the LStar side (portal down, login
      # changed, backend not deployed yet) must never fail the Koff job, which
      # has already finished above.
      - name: Install LStar scraper dependencies
        continue-on-error: true
        working-directory: koff-scraper/lstar
        run: npm ci

      - name: Scrape lstarbg.com
        id: lstar_scrape
        continue-on-error: true
        # Normally ~2 minutes; a stuck run must not eat the whole job.
        timeout-minutes: 20
        working-directory: koff-scraper/lstar
        env:
          LSTAR_EMAIL: ${{ secrets.LSTAR_EMAIL }}
          LSTAR_PASSWORD: ${{ secrets.LSTAR_PASSWORD }}
          LSTAR_PRICES_INCLUDE_VAT: "yes"
          OUT_DIR: out
        run: npm run scrape

      - name: Sync LStar to CaseKing Convex
        if: steps.lstar_scrape.outcome == 'success'
        continue-on-error: true
        working-directory: koff-scraper/lstar
        env:
          CASEKING_CONVEX_URL: ${{ secrets.CASEKING_SYNC_CONVEX_URL }}
          CASEKING_SYNC_SECRET: ${{ secrets.CASEKING_SYNC_DEV_SECRET }}
          # LIVE only when the owner's switch is on AND this run is live for
          # Koff too (a manual Koff dry run keeps LStar dry as well).
          LIVE: ${{ vars.LSTAR_SYNC_ENABLED == 'true' && (github.event.inputs.live || 'true') == 'true' && 'true' || 'false' }}
          STOCK_ZERO_MODE: ${{ github.event_name == 'schedule' && 'apply' || github.event.inputs.stock_zero || 'dry' }}
          IN_FILE: out/lstar-products.json
          OUT_DIR: out
        run: npm run sync

      - name: Upload the LStar report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: lstar-sync-${{ github.run_id }}
          path: |
            koff-scraper/lstar/out/lstar-sync-report.json
            koff-scraper/lstar/out/lstar-report.json
            koff-scraper/lstar/out/lstar-products.csv
            koff-scraper/lstar/out/lstar-products-priced.csv
          if-no-files-found: ignore
          retention-days: 14
