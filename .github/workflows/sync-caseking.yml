name: Sync to case-king.bg

on:
  workflow_dispatch:
    inputs:
      live:
        description: 'LIVE (true = реален запис в case-king.bg, false = само преглед)'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

      limit:
        description: 'Лимит продукти'
        required: false
        default: '5'

      force:
        description: 'FORCE'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

      stock_zero:
        description: 'Продукти извън feed-а: dry = само брои, apply = нулира наличността'
        required: false
        default: 'dry'
        type: choice
        options:
          - 'dry'
          - 'apply'

  schedule:
    - cron: '0 3 * * 0'

concurrency:
  group: sync-caseking
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install scraper dependencies
        working-directory: koff-scraper/scraper
        run: npm install

      - name: Run koff.ro scraper
        working-directory: koff-scraper/scraper
        env:
          KOFF_EMAIL: ${{ secrets.KOFF_EMAIL }}
          KOFF_PASSWORD: ${{ secrets.KOFF_PASSWORD }}
        run: npm run scrape

      - name: Sync to CaseKing Convex
        working-directory: koff-scraper/scraper
        env:
          # Its OWN secret, deliberately not the shared CASEKING_CONVEX_URL:
          # that one is the fulfillment workers' input, and they hard-pin the
          # old production deployment (elated-butterfly-122) because the live
          # shop's orders are still fulfilled from there. The env var NAME
          # stays as the script expects it; only the source differs.
          CASEKING_CONVEX_URL: ${{ secrets.CASEKING_SYNC_CONVEX_URL }}
          CASEKING_SYNC_SECRET: ${{ secrets.CASEKING_SYNC_SECRET }}
          LIVE: ${{ github.event.inputs.live || 'true' }}
          LIMIT: ${{ github.event.inputs.limit || 'all' }}
          CLEANUP: 'false'
          FORCE: ${{ github.event.inputs.force || 'false' }}
          # Scheduled runs carry no inputs, so they always stay on 'dry' -
          # applying the stock-zero pass is a deliberate manual choice.
          STOCK_ZERO_MODE: ${{ github.event.inputs.stock_zero || 'dry' }}
        run: node sync-caseking.mjs
