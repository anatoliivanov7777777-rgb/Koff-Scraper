name: Sync to case-king.bg

# Ръчно пускане + автоматично всяка нощ.
#
# ВАЖНО за автоматичния run: при `schedule` полетата от формата НЕ
# съществуват (github.event.inputs е празно), затова навсякъде по-долу
# има резервна стойност през `||`. Без нея LIVE щеше да е празен низ и
# нощният run щеше да е безполезен dry run.
on:
  workflow_dispatch:
    inputs:
      live:
        description: 'LIVE (true = реален запис в case-king.bg, false = само преглед)'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      limit:
        description: 'Лимит суровини продукти (напр. 5). За ПЪЛЕН run напиши думата: all'
        required: false
        default: '5'
      cleanup:
        description: 'CLEANUP (true = ИЗТРИВА всичко със source=koff-sync, без да качва нищо ново)'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      force:
        description: 'FORCE (true = пропуска проверката за минимален брой скрейпнати продукти)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

  schedule:
    # 03:00 UTC = 06:00 българско лятно / 05:00 зимно време.
    # GitHub cron е ВИНАГИ в UTC и не следи смяната на часа, затова
    # реалният час се измества с час два пъти годишно.
    - cron: '0 3 * * *'

# Пази от застъпване: ако предишен run още върви, новият изчаква вместо
# да се логва паралелно в koff.ro и да пише едновременно в Convex.
concurrency:
  group: sync-caseking
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: koff-scraper/scraper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install

      - name: Run koff.ro scraper (генерира koff-products-raw.json)
        if: github.event.inputs.cleanup != 'true'
        env:
          KOFF_EMAIL: ${{ secrets.KOFF_EMAIL }}
          KOFF_PASSWORD: ${{ secrets.KOFF_PASSWORD }}
          CONVEX_HTTP_URL: ${{ secrets.CONVEX_HTTP_URL }}
          SCRAPER_SECRET: ${{ secrets.SCRAPER_SECRET }}
        run: npm run scrape

      - name: Sync to case-king.bg
        env:
          # Нощем: реален пълен sync, без изтриване.
          LIVE: ${{ github.event.inputs.live || 'true' }}
          LIMIT: ${{ github.event.inputs.limit || 'all' }}
          CLEANUP: ${{ github.event.inputs.cleanup || 'false' }}
          FORCE: ${{ github.event.inputs.force || 'false' }}
        run: node sync-caseking.mjs
