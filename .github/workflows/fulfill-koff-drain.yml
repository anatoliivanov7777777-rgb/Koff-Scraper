name: Koff fulfillment drain

# Since 2026-10-06 the drain also runs on its own every 10 minutes (owner:
# orders from the site must reach the Koff cart automatically). A scheduled run
# is a live run that drains the whole queue (owner, 2026-10-24: wholesale
# orders can have 300+ lines); the manual run can still set a smaller bound.
# Both read the shop database's URL and secret - the same pair the daily
# catalogue sync already uses successfully.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      confirm_live:
        description: 'Confirm LIVE run (true = will sequentially drain pending fulfillments and may write to the real Koff cart)'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      max_items:
        description: 'How many order lines this run may process: all, or a number (max 2000)'
        required: false
        default: 'all'

permissions:
  contents: read

# Must serialize against the SAME global Koff cart resource as the manual
# one-item worker (fulfill-koff.yml) - never let both run at once.
concurrency:
  group: koff-cart-fulfillment
  cancel-in-progress: false

jobs:
  drain:
    if: ${{ github.event_name == 'schedule' || github.event.inputs.confirm_live == 'true' }}
    # Since 2026-10-27 Koff sits behind a Cloudflare check that only lets a
    # real browser through, so this runs on the owner's computer (self-hosted
    # runner, labels self-hosted/Windows/koff) and sends Koff requests through
    # Chrome there (KOFF_BROWSER=true). Chrome opens only if there is an order
    # line to add - an empty queue never touches Koff.
    runs-on: [self-hosted, Windows, koff]
    timeout-minutes: 120
    defaults:
      run:
        working-directory: koff-scraper/scraper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run Koff fulfillment drain (strictly sequential, bounded)
        env:
          KOFF_EMAIL: ${{ secrets.KOFF_EMAIL }}
          KOFF_PASSWORD: ${{ secrets.KOFF_PASSWORD }}
          CASEKING_CONVEX_URL: ${{ secrets.CASEKING_SYNC_CONVEX_URL }}
          CASEKING_SYNC_SECRET: ${{ secrets.CASEKING_SYNC_DEV_SECRET }}
          KOFF_CART_LIVE: 'true'
          KOFF_BROWSER: "true"
          KOFF_FULFILLMENT_MAX_ITEMS: ${{ github.event.inputs.max_items || 'all' }}
        run: node koff-fulfillment-drain.mjs
