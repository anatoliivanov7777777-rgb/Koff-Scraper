name: Koff fulfillment drain

on:
  workflow_dispatch:
    inputs:
      confirm_live:
        description: 'Confirm LIVE run (true = will sequentially drain pending fulfillments and may write to the real Koff cart)'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      max_items:
        description: 'Safety bound on how many fulfillments this run may process (max 50)'
        required: false
        default: '20'

permissions:
  contents: read

# Must serialize against the SAME global Koff cart resource as the manual
# one-item worker (fulfill-koff.yml) - never let both run at once.
concurrency:
  group: koff-cart-fulfillment
  cancel-in-progress: false

jobs:
  drain:
    if: ${{ github.event.inputs.confirm_live == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: koff-scraper/scraper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install
      - name: Run Koff fulfillment drain (strictly sequential, bounded)
        env:
          KOFF_EMAIL: ${{ secrets.KOFF_EMAIL }}
          KOFF_PASSWORD: ${{ secrets.KOFF_PASSWORD }}
          CASEKING_CONVEX_URL: ${{ secrets.CASEKING_CONVEX_URL }}
          CASEKING_SYNC_SECRET: ${{ secrets.CASEKING_SYNC_SECRET }}
          KOFF_CART_LIVE: 'true'
          KOFF_FULFILLMENT_MAX_ITEMS: ${{ github.event.inputs.max_items }}
        run: node koff-fulfillment-drain.mjs
