name: Scrape koff.ro (manual)

# Manual-only: sync-caseking.yml already performs its own scrape before
# the approved weekly CaseKing sync, so a separate automatic daily
# schedule here would be redundant. This workflow exists for on-demand
# scrape/export runs (e.g. producing a fresh koff-products-raw.json for
# offline analysis) - it never touches CaseKing/Convex/Koff cart.
on:
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: koff-scraper/scraper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install
      - name: Run scraper
        env:
          KOFF_EMAIL: ${{ secrets.KOFF_EMAIL }}
          KOFF_PASSWORD: ${{ secrets.KOFF_PASSWORD }}
          CONVEX_HTTP_URL: ${{ secrets.CONVEX_HTTP_URL }}
          SCRAPER_SECRET: ${{ secrets.SCRAPER_SECRET }}
          # Capture the full product gallery.
          #
          # Without this flag scrape.mjs never issues the product-detail request,
          # `raw.images` is never populated, and koff-products-raw.json carries
          # no `images` field at all - which is why every CaseKing row still
          # holds a single image despite the gallery code being finished and
          # live-verified. sync-caseking.mjs only sends `images` to CaseKing when
          # the gallery fetch actually succeeded for that run, so a scrape
          # without this flag cannot populate a gallery by design.
          #
          # Concurrency is left at the scraper's own default (5) on purpose: this
          # adds one detail request per product across the whole catalogue, and
          # the default is the rate the gallery pool was verified at.
          ENABLE_GALLERY_FETCH: "true"
        run: npm run scrape
      - name: Качване на Excel файловете като artifact
        uses: actions/upload-artifact@v4
        with:
          name: case-king-import-${{ github.run_id }}
          path: |
            koff-scraper/scraper/koff-import-gotovi.xlsx
            koff-scraper/scraper/koff-import-chakashti-kategorii.xlsx
          retention-days: 14
      - name: Качване на суровия каталог (koff-products-raw.json) като отделен artifact
        uses: actions/upload-artifact@v4
        with:
          name: koff-raw-catalog-${{ github.run_id }}
          path: koff-scraper/scraper/koff-products-raw.json
          retention-days: 1
