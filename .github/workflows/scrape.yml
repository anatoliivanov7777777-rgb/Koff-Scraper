name: Scrape koff.ro (manual)

# TEMPORARY, BRANCH-ONLY repurposing of this workflow (koff-multi-image-gallery
# only - main's version of this file is unchanged and still runs the real
# scraper). workflow_dispatch workflows are only selectable in the Actions
# UI when they exist on the default branch, so this reuses the existing
# visible entry to run scraper/verify-gallery-pipeline.mjs instead, while
# this branch is checked out.
#
# This version does NOT run the scraper, does NOT call CaseKing/Convex, does
# NOT touch the Koff cart, and produces no artifacts. It exercises the real
# fetchProductGallery()/buildKoffImages() production functions against
# exactly 3 known product ids (388174, 388192, 388186) - a handful of
# read-only GET requests through the existing authenticated Koff session -
# and prints sanitized results only.
#
# Revert this file to match main (restore the real scraper job) once the
# gallery pipeline is no longer being verified on this branch.
on:
  workflow_dispatch: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: koff-scraper/scraper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install
      - name: Verify gallery pipeline against 3 known products (read-only, sanitized output only)
        env:
          KOFF_EMAIL: ${{ secrets.KOFF_EMAIL }}
          KOFF_PASSWORD: ${{ secrets.KOFF_PASSWORD }}
        run: node verify-gallery-pipeline.mjs
