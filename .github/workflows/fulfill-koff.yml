name: Koff fulfillment worker

on:
  workflow_dispatch:
    inputs:
      confirm_live:
        description: 'Confirm LIVE run (true = will claim one fulfillment and may write to the real Koff cart)'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: read

concurrency:
  group: koff-cart-fulfillment
  cancel-in-progress: false

jobs:
  fulfill:
    if: ${{ github.event.inputs.confirm_live == 'true' }}
    # Since 2026-10-27 Koff sits behind a Cloudflare check that only lets a
    # real browser through, so this runs on the owner's computer (self-hosted
    # runner, labels self-hosted/Windows/koff) and sends Koff requests through
    # Chrome there (KOFF_BROWSER=true). Chrome opens only if there is an order
    # line to add - an empty queue never touches Koff.
    runs-on: [self-hosted, Windows, koff]
    timeout-minutes: 10
    defaults:
      run:
        # cmd, not PowerShell: PowerShell 5 swallows a program's error output
        # (2026-10-27 a failed scrape left no message). Each command writes its
        # whole output to a log file, prints it, and on failure repeats the last
        # lines as ::error:: annotations so the reason shows on the run page.
        shell: cmd
        working-directory: koff-scraper/scraper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: |
          call npm install --no-audit --no-fund > install.log 2>&1
          set RC=%ERRORLEVEL%
          type install.log
          if not "%RC%"=="0" powershell -NoProfile -Command "Get-Content -Encoding UTF8 install.log -Tail 20 | ForEach-Object { '::error::' + $_ }"
          exit /b %RC%
      - name: Run Koff fulfillment worker (claims and processes exactly one fulfillment)
        env:
          KOFF_EMAIL: ${{ secrets.KOFF_EMAIL }}
          KOFF_PASSWORD: ${{ secrets.KOFF_PASSWORD }}
          CASEKING_CONVEX_URL: ${{ secrets.CASEKING_SYNC_CONVEX_URL }}
          CASEKING_SYNC_SECRET: ${{ secrets.CASEKING_SYNC_DEV_SECRET }}
          KOFF_CART_LIVE: 'true'
          KOFF_BROWSER: "true"
        run: |
          node koff-fulfillment-worker.mjs > run.log 2>&1
          set RC=%ERRORLEVEL%
          type run.log
          if not "%RC%"=="0" powershell -NoProfile -Command "Get-Content -Encoding UTF8 run.log -Tail 20 | ForEach-Object { '::error::' + $_ }"
          exit /b %RC%
