name: TEMP - Probe Koff product gallery (read-only)

# TEMPORARY diagnostic workflow. Delete this file, and
# koff-scraper/scraper/probe-product-gallery.mjs, once the real gallery
# field on /api/product/:id has been confirmed and product-gallery.mjs has
# been updated to parse it directly.
#
# Runs the read-only probe-product-gallery.mjs against exactly one product:
# a single GET /api/product/:id via the existing authenticated Koff client.
# No other request is made. No CaseKing/Convex call, no Koff cart write, no
# full catalog scrape - this workflow does not import scrape.mjs or
# sync-caseking.mjs at all.
#
# Manual dispatch only, no schedule. Run it with "Use workflow from" set to
# koff-multi-image-gallery so it executes this branch's probe script.

on:
  workflow_dispatch:
    inputs:
      product_id:
        description: 'Koff numeric product id to probe (GET /api/product/:id only)'
        required: true
        default: '388174'

permissions:
  contents: read

concurrency:
  group: koff-gallery-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: koff-scraper/scraper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install
      - name: Probe one product's gallery (single read-only GET, sanitized output only)
        env:
          KOFF_EMAIL: ${{ secrets.KOFF_EMAIL }}
          KOFF_PASSWORD: ${{ secrets.KOFF_PASSWORD }}
        run: node probe-product-gallery.mjs "${{ github.event.inputs.product_id }}"
